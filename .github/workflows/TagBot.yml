name: TagBot
on:
  issue_comment:
    types:
      - created
  workflow_dispatch:
jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # A tag pushed with the deploy key, unlike one pushed with
          # GITHUB_TOKEN, starts the CI workflow, which publishes the docs of
          # the release. For commits that modify workflow files, the key
          # enables tagging, but the release has to be created by hand. See
          # https://github.com/JuliaRegistries/TagBot#commits-that-modify-workflow-files
          ssh: ${{ secrets.DOCUMENTER_KEY }}
