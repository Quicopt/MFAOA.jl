name: TagBot
on:
  issue_comment:
    types:
      - created
  workflow_dispatch:
jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          # A tag created with GITHUB_TOKEN starts no workflow. To publish the
          # docs of a release, run the CI workflow on its tag by hand:
          # gh workflow run CI.yml --ref vX.Y.Z
          token: ${{ secrets.GITHUB_TOKEN }}
